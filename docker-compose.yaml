services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-sql-backend
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres

      DB_READ_USER: ${DB_READ_USER}
      DB_READ_PASS: ${DB_READ_PASS}
      DB_WRITE_USER: ${DB_WRITE_USER}
      DB_WRITE_PASS: ${DB_WRITE_PASS}

      LLM_MODEL: /app/models/example.gguf
      SCHEMA_CONTEXT: /app/logs/context.txt
      ERROR_LOG: /app/logs/ErrorLog.log
      SQL_PROMPT: /app/logs/sql_prompt.txt

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    gpus: all

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs
      - ./example.gguf:/app/models/example.gguf:ro

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    container_name: ai-sql-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data: